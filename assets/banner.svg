<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Accent & Shield Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shieldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.12"/>
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5)); opacity: 0.92; }
        50% { filter: drop-shadow(0 0 22px rgba(168, 85, 247, 0.85)); opacity: 1; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanLine {
        0% { transform: translateY(0px); opacity: 0.15; }
        50% { opacity: 0.8; }
        100% { transform: translateY(260px); opacity: 0.15; }
      }
      @keyframes circuitDash {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes beaconRing {
        0% { r: 12px; opacity: 0.85; stroke-width: 2px; }
        100% { r: 52px; opacity: 0; stroke-width: 0.5px; }
      }
      .pulse-shield { animation: pulseGlow 4s infinite ease-in-out; }
      .scanner { animation: scanLine 5s infinite linear; }
      .circuit-line { stroke-dasharray: 10, 10; animation: circuitDash 9s infinite linear; }
      .radar-sweep { transform-origin: 125px 130px; animation: radarSweep 8s infinite linear; }
      .floating-node-1 { animation: floatNode 3.5s infinite ease-in-out; }
      .floating-node-2 { animation: floatNode 4.5s infinite ease-in-out 1s; }
      .beacon { animation: beaconRing 2.6s infinite cubic-bezier(0.2, 0.8, 0.4, 1); }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="960" height="260" fill="url(#bgGrad)" rx="16"/>
  <rect width="960" height="260" fill="url(#cyberGrid)" rx="16"/>

  <!-- Scanning Line -->
  <rect class="scanner" x="0" y="0" width="960" height="2" fill="url(#scanGrad)" opacity="0.65"/>

  <!-- Circuit Connector Lines -->
  <path class="circuit-line" d="M 125 130 L 230 130 L 260 85 L 360 85" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.45"/>
  <path class="circuit-line" d="M 125 130 L 210 185 L 330 185" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.45"/>
  <path class="circuit-line" d="M 910 55 L 840 55 L 810 95 L 740 95" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35"/>
  <path class="circuit-line" d="M 930 205 L 850 205 L 820 165 L 750 165" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.35"/>

  <!-- Left Radar & IAM Shield Emblem -->
  <g transform="translate(10, 0)">
    <!-- Radar concentric circles -->
    <circle cx="125" cy="130" r="92" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4,4"/>
    <circle cx="125" cy="130" r="66" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.25"/>
    <circle cx="125" cy="130" r="38" fill="none" stroke="#c084fc" stroke-width="1" stroke-opacity="0.3"/>
    
    <!-- Radar Pulse Beacon Wave -->
    <circle class="beacon" cx="125" cy="130" r="12" fill="none" stroke="#38bdf8"/>

    <!-- Radar Sweep Beam -->
    <g class="radar-sweep">
      <path d="M 125 130 L 217 130 A 92 92 0 0 0 125 38 Z" fill="url(#shieldGrad)" opacity="0.12"/>
      <line x1="125" y1="130" x2="217" y2="130" stroke="#38bdf8" stroke-width="1.5" opacity="0.65"/>
    </g>

    <!-- Glowing Shield with Keyhole Icon -->
    <g class="pulse-shield" transform="translate(93, 92) scale(1.5)">
      <!-- Shield Outer Shape -->
      <path d="M 21.5 3 L 5 9.5 C 5 21 12 32 21.5 37 C 31 32 38 21 38 9.5 L 21.5 3 Z" fill="url(#shieldGrad)" filter="url(#shieldGlow)" opacity="0.95"/>
      <!-- Inner Shield Cutout -->
      <path d="M 21.5 6 L 8 11.5 C 8 20.5 13.5 29 21.5 33.5 C 29.5 29 35 20.5 35 11.5 L 21.5 6 Z" fill="#090d16" opacity="0.82"/>
      <!-- Keyhole Symbol inside Shield -->
      <circle cx="21.5" cy="18" r="3" fill="#38bdf8"/>
      <polygon points="20,19 23,19 23.8,26 19.2,26" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Central Title & Descriptions -->
  <g transform="translate(265, 0)">
    <!-- Top Pill Tag -->
    <g class="floating-node-1" transform="translate(0, 32)">
      <rect x="0" y="0" width="270" height="25" rx="12.5" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9"/>
      <circle cx="14" cy="12.5" r="4" fill="#22c55e"/>
      <text x="26" y="16.5" fill="#a5b4fc" font-size="11" class="sub-text" letter-spacing="1.2">ENTERPRISE IDENTITY &amp; SSO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="100" fill="url(#textGrad)" font-size="31" class="title-text" letter-spacing="0.5">
      Awesome Single Sign-On &amp; IAM
    </text>

    <!-- Subtitle -->
    <text x="0" y="136" fill="#f1f5f9" font-size="14.5" class="sub-text">
      Curated Federation of Cloud Identity Providers, SSO &amp; Self-Hosted IdPs
    </text>

    <!-- Feature Pillars / Badges -->
    <g transform="translate(0, 168)">
      <!-- Pill 1: SAML 2.0 / OIDC -->
      <rect x="0" y="0" width="138" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="69" y="18" fill="#bae6fd" font-size="11.5" text-anchor="middle" class="sub-text">⚡ SAML 2.0 / OIDC</text>

      <!-- Pill 2: SCIM Provisioning -->
      <rect x="148" y="0" width="138" height="28" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5"/>
      <text x="217" y="18" fill="#c7d2fe" font-size="11.5" text-anchor="middle" class="sub-text">🔄 SCIM Provisioning</text>

      <!-- Pill 3: Passkeys / MFA -->
      <rect x="296" y="0" width="138" height="28" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <text x="365" y="18" fill="#e9d5ff" font-size="11.5" text-anchor="middle" class="sub-text">🔑 Passkeys / MFA</text>

      <!-- Pill 4: AI Agent IAM -->
      <rect x="444" y="0" width="138" height="28" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
      <text x="513" y="18" fill="#a7f3d0" font-size="11.5" text-anchor="middle" class="sub-text">🤖 AI Agent IAM</text>
    </g>

    <!-- Protocol Sub-footer -->
    <text x="2" y="224" fill="#64748b" font-size="11" class="sub-text" letter-spacing="0.4">
      OAuth 2.0 • LDAP Federation • Zero Trust Access • FIDO2/WebAuthn • Headless CIAM
    </text>
  </g>

  <!-- Right Decorative Floating Identity Nodes -->
  <g class="floating-node-2" transform="translate(820, 50)">
    <circle cx="50" cy="35" r="18" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
    <text x="50" y="41" font-size="15" text-anchor="middle">🔐</text>
    
    <circle cx="15" cy="105" r="16" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" opacity="0.85"/>
    <text x="15" y="111" font-size="13" text-anchor="middle">🛡️</text>
    
    <circle cx="75" cy="120" r="15" fill="#1e1b4b" stroke="#10b981" stroke-width="1.5" opacity="0.85"/>
    <text x="75" y="125" font-size="12" text-anchor="middle">⚡</text>

    <!-- Node Connector Lines -->
    <line x1="50" y1="35" x2="15" y2="105" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.5"/>
    <line x1="50" y1="35" x2="75" y2="120" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.5"/>
  </g>

  <!-- Outer Border Gradient Stroke -->
  <rect x="1" y="1" width="958" height="258" fill="none" stroke="url(#textGrad)" stroke-width="1.5" rx="15" opacity="0.4"/>
</svg>
